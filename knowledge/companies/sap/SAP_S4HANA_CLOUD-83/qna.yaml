- answer: 'To process customer invoices, you can follow these steps:
    1. Post an invoice in the source app. The system automatically creates an electronic
    document.
    2. In the eDocument Cockpit, in the Romania eInvoice process, select one or more
    electronic documents and choose Submit. For each selected electronic document,
    the system creates an XML file according to the predefined format and forwards
    it to the external system.
    3. The external system processes the XML file and returns a status of the document
    to the system.
    4. The system updates the status of the document in the eDocument Cockpit app.
    '
  question: ' How do I process customer invoices?'
- answer: 'To create and send electronic, customer tax invoices, you can follow these
    steps:
    1. Configure the communication with external systems.
    2. Create and send tax invoices in XML format to the National Tax Service (NTS)
    and your customers via a service provider.
    3. Respond to electronic, self-billing tax invoices that your customers create.
    4. Approve or reject self-billing tax invoices that your customers create, and
    send your response to them via a service provider.
    5. Create and send self-billing tax invoices to suppliers for review via a service
    provider.
    6. Receive and verify electronic, supplier tax invoices.
    7. Import supplier tax invoices into your SAP system.
    8. Manage invoice verification tasks.
    '
  question: ' How do I create and send electronic, customer tax invoices?'
