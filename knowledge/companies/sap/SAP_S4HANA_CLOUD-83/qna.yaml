- answer: 'To maintain a VAT number for a business partner, you can follow these steps:
    1. Open the business partner master data in the Manage Business Partner Master
    Data app.
    2. Under , choose  Create.
    3. In  Tax Category, enter &lt;XX&gt;0 (where &lt;XX&gt; is the two-digit ISO
